[project]
name = "desktop2stereo"
version = "3.0b0"
description = "desktop2stereo poject"
requires-python = ">=3.20"
dependencies = [
  "torch",
  "pillow",
  "pygltflib>=1.16.5",
  "transformers",
  "onnx",
  "onnxruntime-gpu[cuda,cudnn]>=1.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
