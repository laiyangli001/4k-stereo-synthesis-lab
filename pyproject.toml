[project]
name = "desktop2stereo"
version = "3.0b0"
description = "desktop2stereo poject"
requires-python = ">=3.20"
dependencies = [
  "torch",
  "pillow",
  "pygltflib>=1.16.5",
  "transformers",
  "onnx",
  "onnxruntime-gpu[cuda,cudnn]>=1.26.0",
]

[project.optional-dependencies]
panda3d-probe = [
  "panda3d==1.10.15",
  "panda3d-gltf==1.3.0",
  "panda3d-simplepbr==0.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
